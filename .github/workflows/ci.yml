name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # CPU-only torch keeps the install small; the tests use small synthetic indexes and need no model downloads.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[serve,dev]" ruff
      - run: ruff check src tests scripts
      - run: pytest -q

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false  # the module has no third-party dependencies, so there is no go.sum to key a cache on
      - run: go vet ./...
        working-directory: ingest
      - run: go test ./...
        working-directory: ingest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check
        working-directory: deploy/terraform
      - run: terraform init -backend=false
        working-directory: deploy/terraform
      - run: terraform validate
        working-directory: deploy/terraform
