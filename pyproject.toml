[project]
name = "wikiret"
version = "0.1.0"
description = "Passage retrieval over Wikipedia: BM25, dense, hybrid, with a reproducible evaluation harness."
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pyarrow>=17", "scipy>=1.13", "PyStemmer>=2.2"]

[project.optional-dependencies]
serve = ["faiss-cpu", "fastapi", "uvicorn", "prometheus-client", "onnxruntime", "tokenizers", "sentence-transformers", "peft"]
agent = ["langgraph>=1.0", "langchain-core>=1.0"]
train = ["mlflow-skinny"]
dev = ["pytest>=8", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]
